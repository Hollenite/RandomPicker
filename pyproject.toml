[project]
name = "revisit-picker"
version = "0.1.0"
description = "Weighted daily revisit picker with a Telegram bot, run from GitHub Actions."
requires-python = ">=3.12"
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
